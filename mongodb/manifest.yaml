apiVersion: v1 
kind: Service
metadata: 
  name: mongodb
  namespace: safety
spec:
  selector:
    project: safety
    component: mongodb
    tier: db
  ports:
    - protocol: TCP
      port: 27017 ## services port
      targetPort: 27017 ## container port
---
apiVersion: v1 
kind: Service
metadata: 
  name: mongodb-headless
  namespace: safety
spec:
  clusterIP: None
  selector:
    project: safety
    component: mongodb
    tier: db
  ports:
    - protocol: TCP
      port: 27017 ## services port
      targetPort: 27017 ## container port
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: safety
spec:
  selector:
    matchLabels:
      project: safety
      component: mongodb
      tier: db
  serviceName: "mongodb-headless" ## This should be headless service name
  replicas: 2 # by default is 1
  template:
    metadata:
      labels:
        project: safety
        component: mongodb
        tier: db        
    spec:
      containers:
      - name: mongodb
        image: hanvihanshith/mongodb:v1
        volumeMounts:
        - name: mongodb
          mountPath: /data/db
  ### This is nothing but PVC, you can directly create here
  volumeClaimTemplates:
  - metadata:
      name: mongodb
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "safety-ebs"
      resources:
        requests:
          storage: 1Gi